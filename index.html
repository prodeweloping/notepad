<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Notes · pro toolss</title>
    <meta name="description" content="Glassmorphism notepad with auto-save, counters, and one-click download.">
    <link rel="icon" type="image/png" href="https://i.ibb.co/FkJPMZ8r/Chat-GPT-Image-Jun-18-2026-07-58-22-AM.png">
    <link rel="apple-touch-icon" href="https://i.ibb.co/FkJPMZ8r/Chat-GPT-Image-Jun-18-2026-07-58-22-AM.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #e0e7ff 0%, #c7d2fe 50%, #a5b4fc 100%);
            padding-top: 80px;
            padding-bottom: 80px;
        }

        /* ===== NAVBAR ===== */
        .new-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 999;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.06);
            padding: 12px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.4);
        }

        .logo {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .logo-blue {
            color: #007BFF;
        }

        .logo-orange {
            color: #FF6F00;
        }

        .home-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            transition: transform 0.2s ease;
        }

        .home-btn:hover {
            transform: scale(0.92);
        }

        .home-btn .lines {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .home-btn .lines span {
            width: 26px;
            height: 3px;
            background: #1e293b;
            border-radius: 10px;
            transition: 0.2s;
        }

        .home-btn:hover .lines span {
            background: #007BFF;
        }

        .home-btn .label {
            font-size: 10px;
            font-weight: 700;
            color: #1e293b;
            margin-top: 3px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ===== MAIN CARD ===== */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .glass-card {
            width: 100%;
            max-width: 820px;
            background: rgba(255, 255, 255, 0.28);
            backdrop-filter: blur(18px) saturate(180%);
            -webkit-backdrop-filter: blur(18px) saturate(180%);
            border-radius: 2.8rem;
            padding: 2rem 2rem 1.8rem;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.2), inset 0 1px 2px rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            box-shadow: 0 40px 80px -16px rgba(0, 0, 0, 0.25);
        }

        /* ===== TOOLBAR ===== */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem 1.2rem;
            margin-bottom: 1.5rem;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .logo-icon {
            font-size: 2rem;
            line-height: 1;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.08));
        }

        .logo-text {
            font-weight: 700;
            font-size: 1.3rem;
            letter-spacing: -0.3px;
            color: #0f172a;
            background: rgba(255, 255, 255, 0.4);
            padding: 0.1rem 1rem 0.1rem 0.8rem;
            border-radius: 40px;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .action-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.5rem;
        }

        /* ===== BUTTONS ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            padding: 0.5rem 1.1rem;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            color: #0f172a;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.85);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            border-color: rgba(255, 255, 255, 0.9);
        }

        .btn:active {
            transform: scale(0.94);
        }

        .btn-primary {
            background: #007BFF;
            color: white;
            border-color: #007BFF;
            box-shadow: 0 4px 16px rgba(0, 123, 255, 0.3);
        }

        .btn-primary:hover {
            background: #0066dd;
            border-color: #0066dd;
            box-shadow: 0 6px 24px rgba(0, 123, 255, 0.4);
            transform: translateY(-2px);
        }

        .btn-icon {
            font-size: 1.1rem;
            line-height: 1;
        }

        /* ===== TEXTAREA ===== */
        .note-wrapper {
            position: relative;
            margin-bottom: 1.2rem;
        }

        #notePad {
            width: 100%;
            min-height: 380px;
            max-height: 65vh;
            padding: 1.5rem 1.8rem;
            font-size: 1rem;
            line-height: 1.8;
            color: #0f172a;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 1.8rem;
            resize: vertical;
            outline: none;
            transition: all 0.25s ease;
            font-family: inherit;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.02);
        }

        #notePad:focus {
            border-color: #007BFF;
            background: rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 0 6px rgba(0, 123, 255, 0.08), inset 0 2px 12px rgba(0, 0, 0, 0.02);
        }

        #notePad::placeholder {
            color: #64748b;
            opacity: 0.6;
        }

        /* ===== STATS ===== */
        .stats-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem 1.5rem;
            padding: 0.2rem 0.4rem 0.4rem 0.4rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: #1e293b;
        }

        .stats-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem 1.8rem;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(255, 255, 255, 0.3);
            padding: 0.2rem 1rem 0.2rem 0.8rem;
            border-radius: 30px;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .stat-label {
            opacity: 0.6;
        }
        .stat-value {
            font-weight: 700;
            min-width: 1.8rem;
            text-align: center;
            color: #0f172a;
        }

        #autoSaveIndicator {
            opacity: 0.5;
            font-size: 0.75rem;
            color: #334155;
        }

        /* ===== TOAST ===== */
        .toast-container {
            position: fixed;
            bottom: 100px;
            right: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.6rem;
            z-index: 9999;
            pointer-events: none;
        }

        .toast {
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            color: #f1f5f9;
            padding: 0.8rem 1.6rem;
            border-radius: 60px;
            font-size: 0.9rem;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.2);
            pointer-events: auto;
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .toast-success {
            border-left: 4px solid #22c55e;
        }
        .toast-error {
            border-left: 4px solid #ef4444;
        }
        .toast-info {
            border-left: 4px solid #3b82f6;
        }

        @keyframes slideIn {
            0% {
                opacity: 0;
                transform: translateX(50px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        /* ===== FOOTER ===== */
        footer {
            background: #0b1426;
            color: white;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }

        .design-footer {
            color: #94a3b8;
            font-size: 0.95rem;
        }

        .highlight {
            color: #facc15;
            font-weight: 700;
            text-decoration: underline;
            text-underline-offset: 3px;
            transition: 0.2s;
        }

        .highlight:hover {
            color: #fde047;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 640px) {
            body {
                padding-top: 70px;
                padding-bottom: 75px;
            }

            .glass-card {
                padding: 1.2rem;
                border-radius: 2rem;
            }

            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .action-group {
                justify-content: flex-start;
                flex-wrap: wrap;
            }

            .btn {
                padding: 0.4rem 0.8rem;
                font-size: 0.78rem;
            }

            .stats-row {
                flex-direction: column;
                align-items: stretch;
                gap: 0.4rem;
            }

            .stats-group {
                justify-content: space-between;
            }

            #notePad {
                min-height: 240px;
                padding: 1rem;
                font-size: 0.95rem;
            }

            .logo-text {
                font-size: 1rem;
            }

            .logo {
                font-size: 24px;
            }

            .new-nav {
                padding: 10px 18px;
            }

            .home-btn .lines span {
                width: 22px;
                height: 2.5px;
            }

            .toast-container {
                bottom: 85px;
                right: 1rem;
                left: 1rem;
                align-items: stretch;
            }

            .toast {
                font-size: 0.85rem;
                padding: 0.7rem 1.2rem;
            }

            footer {
                height: 60px;
                font-size: 0.85rem;
            }
        }

        @media (max-width: 420px) {
            .action-group .btn {
                flex: 1 0 auto;
                font-size: 0.72rem;
                padding: 0.35rem 0.6rem;
            }
        }

        /* scrollbar */
        #notePad::-webkit-scrollbar {
            width: 8px;
        }
        #notePad::-webkit-scrollbar-track {
            background: transparent;
        }
        #notePad::-webkit-scrollbar-thumb {
            background: rgba(0, 123, 255, 0.3);
            border-radius: 20px;
        }
        #notePad::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 123, 255, 0.5);
        }
    </style>
</head>
<body>

    <!-- ===== NAVBAR ===== -->
    <nav class="new-nav">
        <div class="logo">
            <span class="logo-blue">Pro</span>
            <span class="logo-orange">Notes</span>
        </div>

        <button id="homeBtn" class="home-btn" aria-label="Home">
            <div class="lines">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <span class="label">Home</span>
        </button>
    </nav>

    <!-- ===== MAIN NOTEPAD ===== -->
    <main>
        <section class="glass-card" aria-label="Notepad tool">
            <header class="toolbar">
                <div class="logo-area">
                    <span class="logo-icon" aria-hidden="true"><i class="fas fa-sticky-note"></i></span>
                    <span class="logo-text">Pro Notes</span>
                </div>
                <div class="action-group">
                    <button class="btn" id="copyBtn" aria-label="Copy notes">
                        <span class="btn-icon"><i class="fas fa-copy"></i></span> Copy
                    </button>
                    <button class="btn" id="printBtn" aria-label="Print notes">
                        <span class="btn-icon"><i class="fas fa-print"></i></span> Print
                    </button>
                    <button class="btn btn-primary" id="saveBtn" aria-label="Save notes">
                        <span class="btn-icon"><i class="fas fa-download"></i></span> Save
                    </button>
                    <button class="btn" id="clearBtn" aria-label="Clear notes">
                        <span class="btn-icon"><i class="fas fa-trash-alt"></i></span> Clear
                    </button>
                </div>
            </header>

            <div class="note-wrapper">
                <textarea id="notePad" placeholder="Write your notes here…" aria-label="Note editor" spellcheck="true"></textarea>
            </div>

            <div class="stats-row">
                <div class="stats-group">
                    <span class="stat-item">
                        <span class="stat-label"><i class="fas fa-font"></i></span>
                        <span class="stat-value" id="charCount">0</span>
                    </span>
                    <span class="stat-item">
                        <span class="stat-label"><i class="fas fa-file-alt"></i></span>
                        <span class="stat-value" id="wordCount">0</span>
                    </span>
                    <span class="stat-item">
                        <span class="stat-label"><i class="fas fa-list-ol"></i></span>
                        <span class="stat-value" id="lineCount">0</span>
                    </span>
                </div>
                <span id="autoSaveIndicator"><i class="fas fa-sync-alt fa-fw"></i> auto‑save</span>
            </div>
        </section>
    </main>

    <!-- ===== TOAST ===== -->
    <div class="toast-container" id="toastContainer" aria-live="polite"></div>

    <!-- ===== FOOTER ===== -->
    <footer>
        <div class="design-footer">
            Design by
            <a href="https://www.protoolss.online" target="_blank" class="highlight">
                Pro Toolss
            </a>
        </div>
    </footer>

    <script>
        (function() {
            "use strict";

            // DOM refs
            const note = document.getElementById('notePad');
            const charSpan = document.getElementById('charCount');
            const wordSpan = document.getElementById('wordCount');
            const lineSpan = document.getElementById('lineCount');
            const copyBtn = document.getElementById('copyBtn');
            const printBtn = document.getElementById('printBtn');
            const saveBtn = document.getElementById('saveBtn');
            const clearBtn = document.getElementById('clearBtn');
            const toastContainer = document.getElementById('toastContainer');
            const autoSaveIndicator = document.getElementById('autoSaveIndicator');
            const homeBtn = document.getElementById('homeBtn');

            // ---------- Home button ----------
            homeBtn.addEventListener('click', function() {
                window.location.href = 'https://www.protoolss.online';
            });

            // ---------- Counters ----------
            function updateCounters() {
                const text = note.value;
                charSpan.textContent = text.length;
                const wordCount = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
                wordSpan.textContent = wordCount;
                const lineCount = text === '' ? 0 : text.split(/\n/).length;
                lineSpan.textContent = lineCount;
            }

            // ---------- Toast ----------
            function showToast(message, type = 'info', duration = 2800) {
                const toast = document.createElement('div');
                toast.className = `toast toast-${type}`;
                toast.textContent = message;
                toastContainer.appendChild(toast);
                setTimeout(() => {
                    if (toast.parentNode) toast.remove();
                }, duration);
            }

            // ---------- Auto resize ----------
            function autoResize() {
                note.style.height = 'auto';
                note.style.height = note.scrollHeight + 'px';
            }

            // ---------- LocalStorage ----------
            function saveToLocal() {
                try {
                    localStorage.setItem('pro-notes-data', note.value);
                    autoSaveIndicator.style.opacity = '1';
                    setTimeout(() => { autoSaveIndicator.style.opacity = '0.6'; }, 700);
                } catch (_) { /* ignore */ }
            }

            function restoreFromLocal() {
                try {
                    const saved = localStorage.getItem('pro-notes-data');
                    if (saved !== null) {
                        note.value = saved;
                        updateCounters();
                        autoResize();
                    }
                } catch (_) { /* ignore */ }
            }

            // ---------- DOWNLOAD (SAVE) ----------
            function downloadNotes() {
                const content = note.value;

                if (!content || content.trim() === '') {
                    showToast('📭 Nothing to save — write something first.', 'error');
                    return;
                }

                if (!confirm('📥 Save notes as .txt file on your device?')) {
                    return;
                }

                try {
                    const now = new Date();
                    const y = now.getFullYear();
                    const m = String(now.getMonth() + 1).padStart(2, '0');
                    const d = String(now.getDate()).padStart(2, '0');
                    const filename = `notes-${y}-${m}-${d}.txt`;

                    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);

                    showToast(`✅ Downloaded as ${filename}`, 'success');
                } catch (e) {
                    showToast('❌ Download failed', 'error');
                }
            }

            // ---------- Clear ----------
            function clearNotes() {
                if (note.value.trim() === '') {
                    showToast('📭 Already empty', 'info');
                    return;
                }
                if (confirm('Delete all notes?')) {
                    note.value = '';
                    updateCounters();
                    autoResize();
                    saveToLocal();
                    showToast('🗑️ Notes cleared', 'info');
                }
            }

            // ---------- Copy ----------
            function copyNotes() {
                const text = note.value;
                if (!text) {
                    showToast('📭 Nothing to copy', 'error');
                    return;
                }
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text)
                        .then(() => showToast('📋 Copied to clipboard', 'success'))
                        .catch(() => fallbackCopy(text));
                } else {
                    fallbackCopy(text);
                }
            }

            function fallbackCopy(text) {
                try {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    ta.style.position = 'fixed';
                    ta.style.opacity = '0';
                    ta.style.pointerEvents = 'none';
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    showToast('📋 Copied to clipboard', 'success');
                } catch (_) {
                    showToast('❌ Copy failed', 'error');
                }
            }

            // ---------- Print ----------
            function printNotes() {
                const content = note.value;
                if (!content.trim()) {
                    showToast('📭 Nothing to print', 'error');
                    return;
                }
                const win = window.open('', '_blank', 'width=600,height=400');
                if (!win) {
                    showToast('⚠️ Please allow popups for printing', 'error');
                    return;
                }
                win.document.write(`<!DOCTYPE html><html><head><title>Pro Notes</title><style>
                    body { font-family: 'Segoe UI', system-ui; padding: 2rem; max-width: 700px; margin: 0 auto; white-space: pre-wrap; line-height:1.7; background:#f8fafc; }
                </style></head><body>${content.replace(/\n/g, '<br>')}</body></html>`);
                win.document.close();
                win.focus();
                win.print();
                setTimeout(() => win.close(), 1200);
            }

            // ---------- Init ----------
            function init() {
                restoreFromLocal();

                note.addEventListener('input', function() {
                    updateCounters();
                    autoResize();
                    saveToLocal();
                });

                window.addEventListener('resize', autoResize);

                updateCounters();
                autoResize();

                copyBtn.addEventListener('click', copyNotes);
                printBtn.addEventListener('click', printNotes);
                saveBtn.addEventListener('click', downloadNotes);
                clearBtn.addEventListener('click', clearNotes);

                // Ctrl+S shortcut
                note.addEventListener('keydown', function(e) {
                    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                        e.preventDefault();
                        downloadNotes();
                    }
                });

                autoSaveIndicator.style.opacity = '0.6';
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>

</body>
</html>
